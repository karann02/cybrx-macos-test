<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Started</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: transparent;
            /* No full-screen background */
        }

        .popup {
            padding: 15px 25px;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            /* Same green gradient */
            color: white;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.5s ease-in-out, fadeOut 1s forwards 5.2s;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        p {
            font-size: 14px;
            opacity: 0.9;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>

<body>
    <div class="popup">
        <h1>✅ Agent Running Successfully!</h1>
        <p>Your application is now working in the background.</p>
    </div>
</body>

</html>
